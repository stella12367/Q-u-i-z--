<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <center>
      <h1>QUIZ of GENERAL KNOWLEDGE</h1>
      <div style="background-color: lightgreen; width: 500px; height: 700px;">
      
      <h2>Score: <span id="scoreDisplay">0</span> / 5</h2>

    
      <p>1. Wat kleur heeft de vlag van Canada?</p>
      <button class="q1-btn" onclick="checkAnswer(this, false)">rood en groen</button>
      <button class="q1-btn" onclick="checkAnswer(this, true)">rood en wit</button>
      <br><p>of</p>
      <button class="q1-btn" onclick="checkAnswer(this, false)">geel en blauw</button>
      
      <p>2. Wat is 3*2(8:2+5)</p>
      <button class="q2-btn" onclick="checkAnswer(this, true)">54</button>
      <button class="q2-btn" onclick="checkAnswer(this, false)">36</button>
      <button class="q2-btn" onclick="checkAnswer(this, false)">53</button>
      <button class="q2-btn" onclick="checkAnswer(this, false)">12</button>

     <p>3.Welke 2 landen liggen Dichter bij Zimbabwe</p>
     <button class="q3-btn" onclick="checkAnswer(this, false)">Australieeee en New Zealand</button>
     <button class="q3-btn" onclick="checkAnswer(this, false)">Poland en America</button>
     <button class="q3-btn" onclick="checkAnswer(this, true)" >Mozambique en Botswana</button>
     <button class="q3-btn" onclick="checkAnswer(this, false)">Cameroen en Niger</button>
    
    <p>4.Welk getal is hoger</p>
    <button class="q4-btn" onclick="checkAnswer(this, false)">1.225.481</button>
    <button class="q4-btn" onclick="checkAnswer(this, false)">2.918.934</button>
    <button class="q4-btn" onclick="checkAnswer(this, false)">3.672.383</button>
    <button class="q4-btn" onclick="checkAnswer(this, true)">3.672.483</button>
    <p>5.Wat is een webtaal(in programeren)</p>
    <button class="q5-btn" onclick="checkAnswer(this, true)">html</button>
    <button class="q5-btn" onclick="checkAnswer(this, false)">javascript</button>
    <button class="q5-btn" onclick="checkAnswer(this, false)">python</button>
    <button class="q5-btn" onclick="checkAnswer(this, false)">ruby</button>
 
<br>
<hr>
<button><a href="page1.html">om naar de volgende pagina te gaan</a></button>
    </center>


    <script>
      let score = 0;

      function checkAnswer(button, isCorrect) {
        // Bepaal de klasse van de knop om te zien bij welke vraag deze hoort
        const btnClass = button.className;
        
        // Zoek alle knoppen van dezelfde vraag
        const siblingButtons = document.getElementsByClassName(btnClass);

        if (isCorrect) {
          score++;
          document.getElementById('scoreDisplay').textContent = score;
          button.style.backgroundColor = '#2ecc71'; // Groen
          button.style.color = 'purple';
          alert('Correct!');
        } else {
          button.style.backgroundColor = '#e74c3c'; // Rood
          button.style.color = 'purple';
          alert('Incorrect');
        }

        // Schakel alle knoppen van deze specifieke vraag uit
        for (let btn of siblingButtons) {
          btn.disabled = true;
        }
      }
    </script>
  </body>
</html>
