    <script>
      let score = 0;

      function checkAnswer(button, isCorrect) {
        // Bepaal de klasse van de knop om te zien bij welke vraag deze hoort
        const btnClass = button.className;
        
        // Zoek alle knoppen van dezelfde vraag
        const siblingButtons = document.getElementsByClassName(btnClass);

        if (isCorrect) {
          score++;
          document.getElementById('scoreDisplay').textContent = score;
          button.style.backgroundColor = '#2ecc71'; // Groen
          button.style.color = 'purple';
          alert('Correct!');
        } else {
          button.style.backgroundColor = '#e74c3c'; // Rood
          button.style.color = 'purple';
          alert('Incorrect');
        }

        // Schakel alle knoppen van deze specifieke vraag uit
        for (let btn of siblingButtons) {
          btn.disabled = true;
        }
      }
    </script>
